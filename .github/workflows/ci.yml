name: CI

on:
  pull_request:
    branches:
      - main
      - ybg-garments
  push:
    branches:
      - ybg-garments
      - fix/security-hardening
      - hardening/admin-checkout-guards

permissions:
  contents: read

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        with:
          node-version: 20
          cache: npm
        uses: actions/setup-node@v4
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
