name: Verify patched dependencies

on:
  workflow_dispatch:
  push:
    branches:
      - hardening/admin-checkout-guards

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    name: Remediate lockfile, audit, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Update vulnerable lockfile dependencies
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: remediate vulnerable dependency lockfile"
          git push
